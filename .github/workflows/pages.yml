# Build the docs site (doc/build.clj -> _site/) and publish it to GitHub Pages
# on every push to main. emcc builds the in-browser interpreter, and the
# runner's Chrome prints the cheat sheet PDF. doc/build.clj carries on
# without either, so the last step checks both landed: a site with dead
# "run" buttons or no PDF shouldn't deploy quietly.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Ubuntu's emscripten package is the toolchain the wasm flags in
      # clerk.clj were worked out against.
      - name: Install emscripten
        run: sudo apt-get update && sudo apt-get install -y emscripten
      - name: Build clove
        run: make
      - name: Build the site
        run: ./clove doc/build.clj
      - name: Check the interpreter and the PDF were built
        run: test -s _site/clove-wasm.js && test -s _site/cheatsheet.pdf && test -s _site/llms.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
