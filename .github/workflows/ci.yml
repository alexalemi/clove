# CI: build + full regression suite on every platform clove claims to support.
# The suite self-skips platform-dependent sections (see the capability probes
# at the top of tests.clj), so one tests.clj runs everywhere.
#
# Pass/fail is clove's exit status plus the suite's last line ("tests complete:
# N passed, 0 failed") -- tests.clj exits 1 on any failed assertion, and a
# script-mode abort exits non-zero before that line prints. Never grep the
# output for "fail|error": tests legitimately print those words.
name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build (zero warnings enforced)
        run: make CFLAGS='-O2 -Wall -Wextra -Werror -Wno-unused-parameter -Wno-unused-function'
      - name: Test (normal + GC stress)
        run: make test-full

  linux-asan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # -O1, not -O0: unoptimized code keeps every temporary in a stack slot,
      # and the conservative stack scan then roots values that -O1 drops --
      # which hides exactly the missing-GC-root bugs this job exists to find.
      # -fno-sanitize-recover: a UBSan report fails the run via exit status.
      # Named ./clove, not clove-asan: the suite re-invokes "<exe-dir>/clove" and
      # "./clove" for its subprocess tests (exit codes, bundle, judge, TUI
      # natives), so the sanitizer build has to BE that binary -- otherwise
      # those tests fail with "not found", and they run uninstrumented anyway.
      - name: Build with ASan/UBSan
        run: cc -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=undefined -o clove clove.c -lm -ldl
      - name: Test under sanitizers
        env:
          # conservative stack scanning reads the whole stack range and never
          # frees pool blocks — leak/UAR checkers must be off (same as Boehm)
          ASAN_OPTIONS: detect_leaks=0:detect_stack_use_after_return=0
        run: |
          rc=0; ./clove tests.clj > out.txt 2>&1 || rc=$?
          tail -1 out.txt
          if [ $rc -ne 0 ] || ! tail -1 out.txt | grep -q '^tests complete: [0-9]* passed, 0 failed$'; then
            grep -v '^PASS$' out.txt | tail -60; exit 1; fi

  # Sanitizers + GC stress together: collecting every 512 allocations is what
  # turns a missing root into a use of a swept cell, and ASan is what turns
  # that use into a report. Slow, so it gets its own job.
  linux-asan-gc-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build with ASan/UBSan
        run: cc -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=undefined -o clove clove.c -lm -ldl
      - name: Test under sanitizers (GC stress)
        env:
          ASAN_OPTIONS: detect_leaks=0:detect_stack_use_after_return=0
          CLOVE_GC_STRESS: "1"
        run: |
          rc=0; ./clove tests.clj > out.txt 2>&1 || rc=$?
          tail -1 out.txt
          if [ $rc -ne 0 ] || ! tail -1 out.txt | grep -q '^tests complete: [0-9]* passed, 0 failed$'; then
            grep -v '^PASS$' out.txt | tail -60; exit 1; fi

  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build (zero warnings enforced)
        run: make CFLAGS='-O2 -Wall -Wextra -Werror -Wno-unused-parameter -Wno-unused-function'
      - name: Timing probe
        run: |
          time ./clove -e '(Thread/sleep 100)'
          time ./clove -e '(let [f1 (future (Thread/sleep 50)) f2 (future (Thread/sleep 50))] @f1 @f2 (println :ok))'
      - name: Test (normal)
        env:
          CLOVE_UNBUFFERED: "1"
        run: |
          rc=0; time ./clove tests.clj > out.txt 2>&1 || rc=$?
          echo "suite rc=$rc: $(tail -1 out.txt)"
          if [ $rc -ne 0 ] || ! tail -1 out.txt | grep -q '^tests complete: [0-9]* passed, 0 failed$'; then
            grep -v '^PASS$' out.txt | tail -60; exit 1; fi
      - name: Test (GC stress)
        run: |
          rc=0; CLOVE_GC_STRESS=1 ./clove tests.clj > out2.txt 2>&1 || rc=$?
          echo "suite rc=$rc: $(tail -1 out2.txt)"
          if [ $rc -ne 0 ] || ! tail -1 out2.txt | grep -q '^tests complete: [0-9]* passed, 0 failed$'; then
            grep -v '^PASS$' out2.txt | tail -60; exit 1; fi

  # Intel coverage without an Intel runner: build the x86_64 slice on the
  # arm64 runner and run the suite under Rosetta 2.
  macos-x86_64-rosetta:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rosetta 2 (usually preinstalled)
        run: softwareupdate --install-rosetta --agree-to-license || true
      - name: Build x86_64 slice
        run: |
          cc -arch x86_64 -O2 -Wall -Wextra -Werror \
             -Wno-unused-parameter -Wno-unused-function \
             -DCLOVE_SHAREDIR='"/usr/local/share/clove"' \
             -o clove clove.c -lm -ldl
          file clove
      - name: Test under Rosetta
        env:
          CLOVE_UNBUFFERED: "1"
          # FFI glue must match the emulated arch, not the host's
          CLOVE_CC: "cc -arch x86_64"
        run: |
          rc=0; ./clove tests.clj > out.txt 2>&1 || rc=$?
          echo "suite rc=$rc: $(tail -1 out.txt)"
          if [ $rc -ne 0 ] || ! tail -1 out.txt | grep -q '^tests complete: [0-9]* passed, 0 failed$'; then
            grep -v '^PASS$' out.txt | tail -60; exit 1; fi

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - name: Build (zero warnings enforced)
        run: |
          gcc -O2 -Wall -Wextra -Werror -Wno-unused-parameter -Wno-unused-function \
              -static -o clove.exe clove.c -lm -lws2_32
      - name: Smoke test
        run: |
          ls -la clove.exe
          ./clove.exe -e '(println :hello-windows)' || { echo "launch rc=$?"; exit 1; }
      - name: Test (platform-dependent sections self-skip)
        env:
          CLOVE_UNBUFFERED: "1"
        run: |
          rc=0; ./clove.exe tests.clj > out.txt 2>&1 || rc=$?
          echo "suite rc=$rc: $(tail -1 out.txt | tr -d '\r'), lines: $(wc -l < out.txt)"
          if [ $rc -ne 0 ] || ! tail -1 out.txt | tr -d '\r' | grep -q '^tests complete: [0-9]* passed, 0 failed$'; then
            grep -v '^PASS' out.txt | tail -60; exit 1; fi
          grep SKIP out.txt
      - name: Test (GC stress)
        env:
          CLOVE_UNBUFFERED: "1"
        run: |
          rc=0; CLOVE_GC_STRESS=1 ./clove.exe tests.clj > out2.txt 2>&1 || rc=$?
          echo "suite rc=$rc: $(tail -1 out2.txt | tr -d '\r')"
          if [ $rc -ne 0 ] || ! tail -1 out2.txt | tr -d '\r' | grep -q '^tests complete: [0-9]* passed, 0 failed$'; then
            grep -v '^PASS' out2.txt | tail -60; exit 1; fi
